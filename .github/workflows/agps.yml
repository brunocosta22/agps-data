name: refresh-agps

on:
  schedule:
    # Hourly. Broadcast ephemeris is only valid for its ~4 h fit interval, so a
    # slower cadence publishes data that has expired before the next run
    # replaces it: measured on a file built at 05:29 and read at 09:57, 31 of 31
    # Galileo frames and 36 of 37 BeiDou frames were already out of fit.
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build, prune, publish, verify and commit. The whole refresh lives in
      # refresh.sh so it can be run against a checkout by hand and reproduce
      # exactly what CI does -- PUBLISH=0 builds without committing.
      - name: Refresh A-GPS
        env:
          # Thingstream ZTP device-profile token (a UUID). Set as a repo secret:
          # Settings -> Secrets and variables -> Actions. Without it the file is
          # published with the RINEX ephemeris and ionosphere only.
          ASSISTNOW_TOKEN: ${{ secrets.ASSISTNOW_TOKEN }}
        run: ./refresh.sh
