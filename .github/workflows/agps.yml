name: refresh-agps

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        run: |
          echo "TS=$(date -u +%Y%m%d_%H%M)" >> $GITHUB_ENV

      # 12 h, not hourly: this device profile is only entitled to
      # 'uporb_1,ualm' (the richer requests come back rejected), and predicted
      # orbits plus almanac for the day do not go stale within the day. The
      # cache is refreshed anyway the moment its MGA-ANO are for a past day, so
      # the midnight rollover is covered without spending the service quota --
      # which, at one attempt per hour, ran out before mid-morning.
      #
      # Two files, one run, one AssistNow request:
      #   latest.ubx        u-blox AssistNow: almanac for all five
      #                     constellations + one day of predicted orbits
      #                     (MGA-ANO). Live ephemeris is asked for too, but
      #                     this profile is not entitled to it.
      #   latest_rinex.ubx  free RINEX broadcast ephemeris, GPS only, hourly
      # Kept apart because their contents expire on completely different
      # timescales; merged, the served blob looked internally inconsistent
      # (a cached INI-TIME from one half dating the other half's ephemeris).
      - name: Download A-GPS (AssistNow + live RINEX ephemeris)
        env:
          # Thingstream ZTP device-profile token (a UUID). Set as a repo secret:
          # Settings -> Secrets and variables -> Actions. Without it the script
          # publishes the RINEX file only and leaves latest.ubx untouched.
          ASSISTNOW_TOKEN: ${{ secrets.ASSISTNOW_TOKEN }}
        run: |
          mkdir -p docs/archive
          python3 agps_download.py \
              --no-ini \
              --min-prns 32 \
              --output docs/archive/agps_rinex_${TS}.ubx \
              --assistnow-output docs/archive/agps_assistnow_${TS}.ubx \
              --assistnow-data both \
              --assistnow-days 3 \
              --assistnow-cache docs/agps_assistnow_cache.ubx \
              --assistnow-max-age-h 12

      - name: Cleanup old files
        run: |
          find docs/archive -type f -name "*.ubx" -mtime +2 -delete

      - name: Update latest
        run: |
          an="docs/archive/agps_assistnow_${TS}.ubx"
          rn="docs/archive/agps_rinex_${TS}.ubx"

          if [ -s "$rn" ]; then
              cp "$rn" docs/latest_rinex.ubx.tmp
              mv docs/latest_rinex.ubx.tmp docs/latest_rinex.ubx
              echo "latest_rinex.ubx <- $rn ($(stat -c%s docs/latest_rinex.ubx) bytes)"
          else
              echo "::warning::no RINEX blob this run - keeping the previous docs/latest_rinex.ubx"
          fi

          # latest.ubx is the URL the device downloads, so it gets the best blob
          # this run actually produced: u-blox AssistNow when the service
          # answered, else the RINEX ephemeris. Only if neither exists is the
          # previous file left in place - a receiver must never be handed a
          # truncated or empty blob, and it applies whatever it is given.
          if [ -s "$an" ]; then
              src="$an"
          else
              src="$rn"
              echo "::warning::AssistNow unavailable - publishing the RINEX blob as latest.ubx"
          fi
          if [ -s "$src" ]; then
              cp "$src" docs/latest.ubx.tmp
              mv docs/latest.ubx.tmp docs/latest.ubx
              echo "latest.ubx <- $src ($(stat -c%s docs/latest.ubx) bytes)"
          else
              echo "::error::nothing published this run - keeping the previous docs/latest.ubx"
          fi

      # Independent re-read of exactly what is about to be published: frame
      # inventory, checksums, MGA-GPS-EPH field alignment, MGA-ANO expiry.
      - name: Verify published files
        run: |
          for f in docs/latest.ubx docs/latest_rinex.ubx; do
              [ -s "$f" ] && python3 agps_download.py --verify "$f"
          done

      - name: Create status page
        run: |
          cat <<EOF > docs/index.html
          <html>
          <body>
          <h1>A-GPS Server</h1>
          <p>Last update: ${TS} UTC</p>
          <ul>
            <li><a href="latest.ubx">latest.ubx</a> — u-blox AssistNow: almanac,
                ionosphere, predicted orbits (3 days) and live ephemeris for
                GPS, Galileo, GLONASS, BeiDou and QZSS. Use this one.</li>
            <li><a href="latest_rinex.ubx">latest_rinex.ubx</a> — free RINEX
                broadcast ephemeris, GPS only, refreshed hourly. Fallback that
                needs no service token.</li>
          </ul>
          <p>Neither file carries UBX-MGA-INI-TIME: the receiver supplies its own
          time when it applies the data, so a file downloaded hours after it was
          built is never wrong about the hour.</p>
          </body>
          </html>
          EOF

      - name: Commit changes
        run: |
          git config user.name "agps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          git commit -m "A-GPS refresh ${TS}" || echo "No changes"

          git push
