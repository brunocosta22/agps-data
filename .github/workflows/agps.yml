name: refresh-agps

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate timestamp
        run: |
          echo "TS=$(date -u +%Y%m%d_%H%M)" >> $GITHUB_ENV

      # 12 h, not hourly: this device profile has been refusing the richer
      # requests, and predicted orbits for the day do not go stale within it. The cache is refreshed anyway the moment its MGA-ANO are
      # for a past day, so the midnight rollover is covered without spending the
      # service quota -- which, at one attempt per hour, ran out before
      # mid-morning. What the service accepted is recorded in the cache
      # metadata's 'data_used'.
      #
      # One file, one URL for the device: AssistNow almanac and predicted
      # orbits, followed by this hour's GPS ephemeris from RINEX. Live orbits,
      # the ionosphere and health are asked for but refused by this profile;
      # 'data_used' in the cache metadata records what the last fetch got.
      #
      # Three deliberately conservative choices while a fix regression on the
      # vehicle is being tracked down, each reversible without a fetch:
      #   --publish-gnss        GLONASS and QZSS dropped: GLONASS is disabled
      #                         on the receiver, and QZSS is three unhealthy
      #                         satellites geostationary over Japan that never
      #                         rise in Europe. Between them, 18% of the file the
      #                         device downloads and throws away. Galileo and
      #                         BeiDou stay: both are tracked, and both get
      #                         almanac and predicted orbits (precise ephemeris
      #                         is GPS-only, since it comes from RINEX and the
      #                         profile refuses live orbits).
      #   --no-iono             the UBX-MGA-GPS-IONO byte layout was never
      #                         cross-checked against real service output, and a
      #                         wrong ionosphere model is worse than none. Stays
      #                         off until the receiver ACKs it -- docs/test
      #                         carries a variant with it for exactly that.
      #   --variants docs/test  one file per hypothesis, all from this run's
      #                         data, for bisecting a receiver that will not fix. Both halves are sanitised before being written -- the cached
      # MGA-INI-TIME and any expired MGA-ANO are dropped -- which is what makes
      # a single merged file coherent for a receiver that downloads it hours
      # after it was built.
      - name: Download A-GPS (AssistNow + live RINEX ephemeris)
        env:
          # Thingstream ZTP device-profile token (a UUID). Set as a repo secret:
          # Settings -> Secrets and variables -> Actions. Without it the file is
          # published with the RINEX GPS ephemeris only.
          ASSISTNOW_TOKEN: ${{ secrets.ASSISTNOW_TOKEN }}
        run: |
          mkdir -p docs/archive
          python3 agps_download.py \
              --no-ini \
              --min-prns 32 \
              --output docs/archive/agps_${TS}.ubx \
              --assistnow-data both \
              --assistnow-days 3 \
              --publish-gnss gps,gal,bds,sbas \
              --no-iono \
              --variants docs/test \
              --assistnow-cache docs/agps_assistnow_cache.ubx \
              --assistnow-max-age-h 12

      - name: Cleanup old files
        run: |
          find docs/archive -type f -name "*.ubx" -mtime +2 -delete

      # Only replace the published file with a non-empty new one: a receiver
      # fetching latest.ubx mid-run must never get a truncated or empty blob,
      # and it applies whatever it is given.
      - name: Update latest
        run: |
          src="docs/archive/agps_${TS}.ubx"
          if [ -s "$src" ]; then
              cp "$src" docs/latest.ubx.tmp
              mv docs/latest.ubx.tmp docs/latest.ubx
              echo "latest.ubx <- $src ($(stat -c%s docs/latest.ubx) bytes)"
          else
              echo "::error::nothing produced this run - keeping the previous docs/latest.ubx"
              exit 1
          fi

      # Independent re-read of exactly what is about to be published: frame
      # inventory, checksums, MGA-GPS-EPH field alignment, MGA-ANO expiry.
      - name: Verify published file
        run: |
          python3 agps_download.py --verify docs/latest.ubx
          for f in docs/test/*.ubx; do
              [ -s "$f" ] && python3 agps_download.py --verify "$f"
          done

      - name: Create status page
        run: |
          cat <<EOF > docs/index.html
          <html>
          <body>
          <h1>A-GPS Server</h1>
          <p>Last update: ${TS} UTC</p>
          <p><a href="latest.ubx">latest.ubx</a> — u-blox AssistNow aiding
          (almanac and three days of predicted orbits, for GPS, Galileo and
          BeiDou) plus this hour's GPS broadcast ephemeris from RINEX, in one
          UBX-MGA stream. GLONASS and QZSS are left out: the receiver does not
          track them.</p>
          <p>The file carries no UBX-MGA-INI-TIME: the receiver supplies its own
          time when it applies the data, so a file downloaded hours after it was
          built is never wrong about the hour.</p>
          <h2>Test variants</h2>
          <p>One file per hypothesis, all built from the same data, for
          bisecting a receiver that will not fix. Each rung adds one thing to
          the one above it.</p>
          <ul>
            <li><a href="test/01-eph-only.ubx">01-eph-only</a> — GPS ephemeris, nothing else</li>
            <li><a href="test/02-eph-alm.ubx">02-eph-alm</a> — plus almanac</li>
            <li><a href="test/03-eph-alm-ano1.ubx">03-eph-alm-ano1</a> — plus 1 day of predicted orbits</li>
            <li><a href="test/04-eph-alm-ano3.ubx">04-eph-alm-ano3</a> — plus 3 days: same as latest.ubx</li>
            <li><a href="test/05-plus-glo-qzss.ubx">05-plus-glo-qzss</a> — like 04, plus GLONASS and QZSS</li>
            <li><a href="test/06-with-iono.ubx">06-with-iono</a> — like 04, plus the ionosphere model</li>
          </ul>
          </body>
          </html>
          EOF

      - name: Commit changes
        run: |
          git config user.name "agps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          git commit -m "A-GPS refresh ${TS}" || echo "No changes"

          git push
